<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPACIO - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .login-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Right Side - Form */
        .form-section {
            flex: 1;
            background: #ffffff;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* ---- background orbs ---- */
        .form-section .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
        }
        .orb.orb1 {
            width: 300px; height: 300px;
            background: rgba(22,163,74,0.12);
            top: -100px; right: -80px;
            animation: orbFloat1 7s ease-in-out infinite;
        }
        .orb.orb2 {
            width: 220px; height: 220px;
            background: rgba(21,128,61,0.08);
            bottom: -60px; left: -70px;
            animation: orbFloat2 9s ease-in-out infinite;
        }
        .orb.orb3 {
            width: 140px; height: 140px;
            background: rgba(74,222,128,0.1);
            top: 45%; left: 15%;
            animation: orbFloat3 6s ease-in-out infinite;
        }
        @keyframes orbFloat1 {
            0%,100% { transform: translate(0,0) scale(1); }
            50%     { transform: translate(-30px,25px) scale(1.1); }
        }
        @keyframes orbFloat2 {
            0%,100% { transform: translate(0,0) scale(1); }
            50%     { transform: translate(25px,-20px) scale(1.08); }
        }
        @keyframes orbFloat3 {
            0%,100% { transform: translate(0,0) scale(1); opacity:0.1; }
            50%     { transform: translate(15px,15px) scale(1.15); opacity:0.18; }
        }

        /* ---- tiny floating particles ---- */
        .particle {
            position: absolute;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: #16a34a;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }
        .particle.p1 { top:18%; right:12%; animation: particleDrift 5s ease-in-out 0s infinite; }
        .particle.p2 { top:72%; right:8%;  width:4px; height:4px; background:#15803d; animation: particleDrift 7s ease-in-out 1.5s infinite; }
        .particle.p3 { top:38%; right:22%; width:3px; height:3px; background:#4ade80; animation: particleDrift 6s ease-in-out 3s infinite; }
        .particle.p4 { top:85%; right:30%; width:4px; height:4px; background:#16a34a; animation: particleDrift 8s ease-in-out 0.8s infinite; }
        .particle.p5 { top:10%; right:35%; width:3px; height:3px; background:#4ade80; animation: particleDrift 5.5s ease-in-out 2.2s infinite; }
        .particle.p6 { top:55%; right:5%;  width:5px; height:5px; background:#15803d; animation: particleDrift 9s ease-in-out 4s infinite; }
        @keyframes particleDrift {
            0%   { opacity:0; transform:translateY(0) translateX(0); }
            20%  { opacity:0.55; }
            80%  { opacity:0.3; }
            100% { opacity:0; transform:translateY(-40px) translateX(-12px); }
        }

        /* ---- everything above the bg ---- */
        .logo, .form-container { position: relative; z-index: 1; }

        .logo {
            position: absolute;
            top: 40px;
            right: 80px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: logoSlideIn 0.6s cubic-bezier(.22,1,.36,1) 0.15s both;
        }
        @keyframes logoSlideIn {
            from { opacity:0; transform:translateY(-12px); }
            to   { opacity:1; transform:translateY(0); }
        }

        .logo-icon { width:48px; height:48px; }

        .logo-text {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .form-container {
            max-width: 450px;
            width: 100%;
        }

        /* ---- staggered entrance ---- */
        .welcome-header h1 {
            font-size: 48px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            animation: formElIn 0.6s cubic-bezier(.22,1,.36,1) 0.25s both;
        }
        .welcome-header p {
            font-size: 16px;
            color: #9ca3af;
            margin-bottom: 40px;
            animation: formElIn 0.6s cubic-bezier(.22,1,.36,1) 0.35s both;
        }
        .form-group:nth-child(1) { animation: formElIn 0.6s cubic-bezier(.22,1,.36,1) 0.45s both; }
        .form-group:nth-child(2) { animation: formElIn 0.6s cubic-bezier(.22,1,.36,1) 0.55s both; }
        .options-row            { animation: formElIn 0.6s cubic-bezier(.22,1,.36,1) 0.65s both; }
        .sign-in-button         { animation: formElIn 0.6s cubic-bezier(.22,1,.36,1) 0.75s both; }
        .google-sign-in         { animation: formElIn 0.6s cubic-bezier(.22,1,.36,1) 0.85s both; }
        .signup-text            { animation: formElIn 0.6s cubic-bezier(.22,1,.36,1) 0.95s both; }
        @keyframes formElIn {
            from { opacity:0; transform:translateY(18px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* ---- inputs ---- */
        .form-group { margin-bottom: 24px; }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 8px;
            transition: color 0.25s ease;
        }
        .form-group:focus-within label { color: #15803d; }

        .input-wrapper { position: relative; }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            background: #fafafa;
            color: #1a1a1a;
        }
        .input-wrapper input:focus {
            border-color: #16a34a;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(22,163,74,0.13), 0 4px 12px rgba(22,163,74,0.08);
            transform: translateY(-1px);
        }
        .input-wrapper input::placeholder { color:#d1d5db; }

        /* animated bottom-line on focus */
        .input-wrapper::after {
            content:'';
            position:absolute;
            bottom:0; left:50%;
            transform:translateX(-50%);
            width:0; height:2px;
            background: linear-gradient(90deg,#16a34a,#4ade80,#15803d);
            border-radius:0 0 8px 8px;
            transition:width 0.4s cubic-bezier(.22,1,.36,1);
            pointer-events:none;
        }
        .form-group:focus-within .input-wrapper::after { width:100%; }

        /* ---- options row ---- */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .remember-me {
            display:flex; align-items:center; gap:8px;
            font-size:14px; color:#1a1a1a; cursor:pointer;
            transition: color 0.2s;
        }
        .remember-me:hover { color:#15803d; }

        .remember-me input[type="checkbox"] {
            width:18px; height:18px;
            cursor:pointer; accent-color:#16a34a;
            transition: transform 0.2s;
        }
        .remember-me input[type="checkbox"]:checked { transform: scale(1.15); }

        .forgot-password {
            color:#15803d; text-decoration:none;
            font-size:14px; font-weight:500;
            position:relative;
            transition: color 0.25s;
        }
        .forgot-password::after {
            content:'';
            position:absolute; bottom:-2px; left:0;
            width:0; height:1.5px;
            background:#15803d;
            transition:width 0.3s ease;
        }
        .forgot-password:hover { color:#166534; }
        .forgot-password:hover::after { width:100%; }

        /* ---- sign-in button with shimmer ---- */
        .sign-in-button {
            width:100%; padding:14px;
            background: linear-gradient(135deg,#16a34a 0%,#15803d 100%);
            color:white; border:none; border-radius:8px;
            font-size:16px; font-weight:600; cursor:pointer;
            position:relative; overflow:hidden;
            transition: all 0.3s ease;
            margin-bottom:20px;
            box-shadow: 0 4px 14px rgba(22,163,74,0.3);
        }
        /* shimmer sweep */
        .sign-in-button::before {
            content:'';
            position:absolute;
            top:0; left:-100%;
            width:60%; height:100%;
            background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
            animation: shimmerSweep 3s ease-in-out 1.8s infinite;
            pointer-events:none;
        }
        @keyframes shimmerSweep {
            0%   { left:-100%; }
            100% { left:140%; }
        }
        .sign-in-button:hover {
            transform:translateY(-2px);
            box-shadow: 0 6px 24px rgba(22,163,74,0.45);
        }
        .sign-in-button:active { transform:translateY(0); box-shadow: 0 2px 8px rgba(22,163,74,0.3); }

        /* ---- google button ---- */
        .google-sign-in {
            width:100%; padding:14px;
            background:white;
            border:1.5px solid #e5e7eb;
            border-radius:8px;
            font-size:15px; font-weight:500; color:#1a1a1a;
            cursor:pointer;
            display:flex; align-items:center; justify-content:center; gap:12px;
            transition: all 0.3s ease;
            margin-bottom:28px;
            position:relative; overflow:hidden;
        }
        .google-sign-in::before {
            content:'';
            position:absolute; inset:0;
            background: linear-gradient(135deg, rgba(22,163,74,0.04), rgba(74,222,128,0.06));
            opacity:0;
            transition:opacity 0.35s;
            pointer-events:none;
        }
        .google-sign-in:hover { border-color:#86efac; transform:translateY(-1px); box-shadow:0 4px 12px rgba(22,163,74,0.1); }
        .google-sign-in:hover::before { opacity:1; }
        .google-sign-in:active { transform:translateY(0); }
        .google-sign-in .google-icon { position:relative; z-index:1; }

        .google-icon { width:20px; height:20px; }

        /* ---- signup text ---- */
        .signup-text {
            text-align:center;
            font-size:14px; color:#6b7280;
        }
        .signup-text a {
            color:#15803d; text-decoration:none;
            font-weight:600; margin-left:4px;
            position:relative;
            transition:color 0.25s;
        }
        .signup-text a::after {
            content:'';
            position:absolute; bottom:-2px; left:0;
            width:0; height:1.5px;
            background:#15803d;
            transition:width 0.3s ease;
        }
        .signup-text a:hover { color:#166534; }
        .signup-text a:hover::after { width:100%; }

        /* Left Side - Illustration */
        .illustration-section {
            flex: 1;
            background: linear-gradient(160deg, #15803d 0%, #166534 50%, #14532d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .illustration-section svg.scene {
            width: 88%;
            max-width: 520px;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.2));
        }

        /* subtle radial glow behind illustration */
        .illustration-section::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* floating decorative dots */
        .float-dot {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            z-index: 1;
        }
        .float-dot.d1 { width:180px; height:180px; top:-60px; left:-60px; }
        .float-dot.d2 { width:120px; height:120px; bottom:-40px; right:-40px; }
        .float-dot.d3 { width:70px;  height:70px;  top:12%;  right:8%; }
        .float-dot.d4 { width:50px;  height:50px;  bottom:18%; left:10%; }

        /* ---- ANIMATIONS ---- */

        /* panels breathe in on load */
        .panel-sci  { animation: panelIn 0.7s cubic-bezier(.22,1,.36,1) 0.1s both; }
        .panel-comp { animation: panelIn 0.7s cubic-bezier(.22,1,.36,1) 0.3s both; }
        .panel-class{ animation: panelIn 0.7s cubic-bezier(.22,1,.36,1) 0.5s both; }
        @keyframes panelIn {
            from { opacity:0; transform:translateY(28px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* beaker bubbles float up & fade */
        .bubble { animation: bubbleRise 3s ease-in-out infinite; }
        .bubble.b2 { animation-delay: 1s; }
        .bubble.b3 { animation-delay: 2s; }
        @keyframes bubbleRise {
            0%   { transform:translateY(0);   opacity:0.32; }
            60%  { opacity:0.5; }
            100% { transform:translateY(-18px); opacity:0; }
        }

        /* steam wisps drift up */
        .steam { animation: steamDrift 2.4s ease-in-out infinite; }
        .steam.s2 { animation-delay: 1.2s; }
        @keyframes steamDrift {
            0%   { transform:translateY(0);   opacity:0.3; }
            50%  { opacity:0.45; }
            100% { transform:translateY(-14px); opacity:0; }
        }

        /* erlenmeyer liquid shimmer */
        .flask-liquid { animation: shimmer 2.8s ease-in-out infinite; }
        @keyframes shimmer {
            0%,100% { opacity:0.15; }
            50%     { opacity:0.28; }
        }

        /* test-tube liquids gently pulse */
        .tube-liquid { animation: tubePulse 2s ease-in-out infinite; }
        .tube-liquid.t2 { animation-delay:0.7s; }
        .tube-liquid.t3 { animation-delay:1.4s; }
        @keyframes tubePulse {
            0%,100% { opacity:0.15; }
            50%     { opacity:0.3; }
        }

        /* monitor screen lines type-in one by one */
        .screen-line { opacity:0; animation: typeLine 0.5s ease forwards; }
        .screen-line.l2 { animation-delay:3.2s; }
        .screen-line.l3 { animation-delay:3.5s; }
        .screen-line.l4 { animation-delay:3.8s; }
        .screen-line.l5 { animation-delay:6.2s; }
        .screen-line.l6 { animation-delay:6.5s; }
        .screen-line.l7 { animation-delay:6.8s; }
        @keyframes typeLine {
            0%   { opacity:0; stroke-dashoffset:80; }
            100% { opacity:0.35; stroke-dashoffset:0; }
        }
        /* repeat loop for screen lines */
        .screen-line { animation-iteration-count: infinite; animation-duration: 7s; }
        .screen-line.l2 { animation-delay:0.3s; }
        .screen-line.l3 { animation-delay:0.6s; }
        .screen-line.l4 { animation-delay:0.9s; }
        .screen-line.l5 { animation-delay:3.2s; }
        .screen-line.l6 { animation-delay:3.5s; }
        .screen-line.l7 { animation-delay:3.8s; }

        /* cursor blink on monitor 1 */
        .cursor { animation: blink 1.1s step-end infinite; }
        @keyframes blink {
            0%,100% { opacity:0.7; }
            50%     { opacity:0; }
        }

        /* chalk lines draw themselves */
        .chalk { stroke-dasharray:60; stroke-dashoffset:60; animation: chalkDraw 1.2s ease forwards; }
        .chalk.c2 { animation-delay:0.3s; }
        .chalk.c3 { animation-delay:0.6s; }
        @keyframes chalkDraw {
            to { stroke-dashoffset:0; }
        }

        /* floating deco dots pulse in & out */
        .deco-dot { animation: decoPulse 3s ease-in-out infinite; }
        .deco-dot.dd2 { animation-delay:1s; }
        .deco-dot.dd3 { animation-delay:2s; }
        @keyframes decoPulse {
            0%,100% { opacity:0.25; transform:scale(1); }
            50%     { opacity:0.45; transform:scale(1.2); }
        }

        /* plus signs gentle float */
        .deco-plus { animation: plusFloat 5s ease-in-out infinite; }
        .deco-plus.p2 { animation-delay:1.6s; }
        .deco-plus.p3 { animation-delay:3s; }
        .deco-plus.p4 { animation-delay:0.8s; }
        @keyframes plusFloat {
            0%,100% { transform:translateY(0); opacity:0.22; }
            50%     { transform:translateY(-6px); opacity:0.35; }
        }

        /* floating background dots */
        .float-dot { animation: floatBg 8s ease-in-out infinite; }
        .float-dot.d2 { animation-delay:2s; animation-duration:10s; }
        .float-dot.d3 { animation-delay:1s; animation-duration:6s; }
        .float-dot.d4 { animation-delay:3s; animation-duration:7s; }
        @keyframes floatBg {
            0%,100% { transform:scale(1); opacity:0.12; }
            50%     { transform:scale(1.15); opacity:0.2; }
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            .login-container {
                flex-direction: column;
            }

            .illustration-section {
                display: none;
            }

            .form-section {
                padding: 60px 40px;
                justify-content: flex-start;
                padding-top: 120px;
            }

            .logo {
                right: 40px;
            }

            .welcome-header h1 {
                font-size: 36px;
            }
        }

        @media (max-width: 480px) {
            .form-section {
                padding: 40px 30px;
                padding-top: 100px;
            }

            .logo {
                right: 30px;
                top: 30px;
            }

            .logo-text {
                font-size: 20px;
            }

            .welcome-header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Left Side - Illustration -->
        <div class="illustration-section">
            <div class="float-dot d1"></div>
            <div class="float-dot d2"></div>
            <div class="float-dot d3"></div>
            <div class="float-dot d4"></div>

            <svg class="scene" viewBox="0 0 540 420" fill="none" xmlns="http://www.w3.org/2000/svg">

                <!-- ============ SCIENCE LAB PANEL ============ -->
                <rect class="panel-sci" x="18" y="40" width="158" height="340" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.22)" stroke-width="1.8"/>
                <!-- title -->
                <text x="97" y="78" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600" opacity="0.95">Science Lab</text>
                <line x1="72" y1="87" x2="122" y2="87" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.45"/>

                <!-- Beaker -->
                <rect x="38" y="130" width="40" height="68" rx="5" stroke="white" stroke-width="2.2" fill="none" opacity="0.85"/>
                <line x1="33" y1="130" x2="43" y2="130" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
                <line x1="73" y1="130" x2="83" y2="130" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
                <!-- liquid -->
                <rect x="40" y="172" width="36" height="22" rx="2" fill="white" opacity="0.18"/>
                <!-- bubbles -->
                <circle class="bubble" cx="48" cy="158" r="3.2" fill="white" opacity="0.3"/>
                <circle class="bubble b2" cx="60" cy="150" r="2.2" fill="white" opacity="0.22"/>
                <circle class="bubble b3" cx="66" cy="162" r="1.8" fill="white" opacity="0.28"/>
                <!-- steam lines -->
                <path class="steam" d="M52 125 Q55 118 52 112" stroke="white" stroke-width="1.4" fill="none" opacity="0.3" stroke-linecap="round"/>
                <path class="steam s2" d="M62 123 Q65 116 62 110" stroke="white" stroke-width="1.4" fill="none" opacity="0.22" stroke-linecap="round"/>

                <!-- Microscope -->
                <ellipse cx="130" cy="198" rx="20" ry="4.5" fill="white" opacity="0.25"/>
                <line x1="130" y1="198" x2="130" y2="140" stroke="white" stroke-width="3.8" stroke-linecap="round" opacity="0.75"/>
                <line x1="130" y1="143" x2="113" y2="122" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
                <line x1="130" y1="165" x2="130" y2="188" stroke="white" stroke-width="2.4" stroke-linecap="round" opacity="0.6"/>
                <rect x="118" y="187" width="24" height="4" rx="2" fill="white" opacity="0.4"/>

                <!-- Test tube rack -->
                <rect x="38" y="250" width="104" height="10" rx="5" fill="white" opacity="0.22"/>
                <rect x="50" y="215" width="6" height="44" rx="3" fill="white" opacity="0.28"/>
                <rect x="64" y="220" width="6" height="39" rx="3" fill="white" opacity="0.22"/>
                <rect x="78" y="212" width="6" height="47" rx="3" fill="white" opacity="0.32"/>
                <rect x="92" y="218" width="6" height="41" rx="3" fill="white" opacity="0.24"/>
                <rect x="106" y="214" width="6" height="45" rx="3" fill="white" opacity="0.28"/>
                <!-- colored liquid in tubes -->
                <rect class="tube-liquid" x="51" y="240" width="4" height="14" rx="2" fill="white" opacity="0.15"/>
                <rect class="tube-liquid t2" x="79" y="242" width="4" height="12" rx="2" fill="white" opacity="0.18"/>
                <rect class="tube-liquid t3" x="107" y="238" width="4" height="16" rx="2" fill="white" opacity="0.15"/>

                <!-- Erlenmeyer flask -->
                <path d="M60 300 L48 345 Q48 352 55 352 L85 352 Q92 352 92 345 L80 300 Z" stroke="white" stroke-width="2" fill="none" opacity="0.7"/>
                <line x1="58" y1="300" x2="82" y2="300" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
                <rect class="flask-liquid" x="50" y="338" width="40" height="8" rx="2" fill="white" opacity="0.15"/>


                <!-- ============ COMPUTER LAB PANEL ============ -->
                <rect class="panel-comp" x="192" y="40" width="156" height="340" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.22)" stroke-width="1.8"/>
                <!-- title -->
                <text x="270" y="78" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600" opacity="0.95">Computer Lab</text>
                <line x1="238" y1="87" x2="302" y2="87" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.45"/>

                <!-- Monitor 1 -->
                <rect x="215" y="118" width="70" height="48" rx="5" stroke="white" stroke-width="2.2" fill="rgba(255,255,255,0.05)" opacity="0.8"/>
